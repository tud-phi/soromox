# this file is *not* meant to cover or endorse the use of GitHub Actions, but rather to
# help test this project

name: Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  rendering-ubuntu:
    name: Native rendering (Ubuntu, Python 3.12)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Open3D build, graphics, display, and video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential cmake ninja-build glslang-tools \
            xorg-dev libxcb-shm0 libglu1-mesa-dev libssl-dev \
            libc++-dev libc++abi-dev libsdl2-dev libxi-dev libtbb-dev \
            libegl1-mesa-dev libudev-dev libusb-1.0-0-dev \
            autoconf libtool clang xvfb xauth ffmpeg

      - name: Restore native Open3D build cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/soromox/open3d
          key: rendering-ubuntu-open3d-py312-${{ hashFiles('tools/open3d/**') }}

      - name: Build Open3D and install rendering tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./tools/open3d
          python -m pip install -e ".[rendering,test]"

      - name: Test headless frame and MP4 export
        run: |
          env -u DISPLAY \
            EGL_PLATFORM=surfaceless \
            LIBGL_ALWAYS_SOFTWARE=true \
            SOROMOX_RUN_RENDERING_INTEGRATION=1 \
            python -m pytest -q \
            tests/rendering/test_open3d_linux_integration.py::test_open3d_surfaceless_frame_and_mp4_export \
            tests/rendering/test_open3d_color_integration.py

      - name: Test interactive viewers under Xvfb
        run: |
          xvfb-run -a env -u EGL_PLATFORM \
            LIBGL_ALWAYS_SOFTWARE=true \
            SOROMOX_RUN_RENDERING_INTEGRATION=1 \
            python -m pytest -q \
            tests/rendering/test_open3d_linux_integration.py::test_open3d_show_opens_and_closes_real_xvfb_window \
            tests/rendering/test_open3d_linux_integration.py::test_open3d_interactive_sequence_advances_in_real_xvfb_window

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        # platform: [ubuntu-latest, macos-latest, windows-latest]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run non-system tests
        run: python -m pytest --ignore=tests/systems -m "not memory_intensive"

      - name: Run remaining system tests
        run: |
          python -m pytest tests/systems \
            --ignore=tests/systems/test_gvs.py \
            --ignore=tests/systems/test_pcs.py \
            --ignore=tests/systems/test_planar_pcs.py \
            -m "not memory_intensive"

      - name: Run GVS system tests
        run: |
          # Bound the JAX/XLA executable memory retained by each Python process.
          mapfile -t gvs_tests < <(
            python -m pytest tests/systems/test_gvs.py \
              -m "not memory_intensive" \
              --collect-only -q | sed -n '/^tests\/systems\/test_gvs.py::/p'
          )
          if (( ${#gvs_tests[@]} == 0 )); then
            echo "No GVS tests were collected." >&2
            exit 1
          fi
          for ((start = 0; start < ${#gvs_tests[@]}; start += 20)); do
            python -m pytest "${gvs_tests[@]:start:20}"
          done

      - name: Run PCS system tests
        run: python -m pytest tests/systems/test_pcs.py -m "not memory_intensive"

      - name: Run PlanarPCS system tests
        run: python -m pytest tests/systems/test_planar_pcs.py -m "not memory_intensive"

      - name: Run memory-intensive GVS tests
        run: |
          python -m pytest tests/systems/test_gvs.py::test_forward_mode_automatic_differentiability_at_zero_configuration
          python -m pytest tests/systems/test_gvs.py::test_reverse_mode_automatic_differentiability_at_zero_configuration
          python -m pytest tests/systems/test_gvs.py::test_gvs_autodiff_checks
          for basis_type in monomial legendre chebyshev fourier gaussian imq; do
            python -m pytest "tests/systems/test_gvs.py::test_scaled_rotational_basis_batched_partial_cells_match_scalar_paths[$basis_type]"
          done

  minimum-numerical-dependencies:
    name: test (minimum numerical dependencies, Python 3.11)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project with minimum numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "jax==0.10.0" "diffrax==0.7.2"

      - name: Verify minimum dependency versions
        run: |
          python -c "import diffrax; assert diffrax.__version__ == '0.7.2'"
          python -c "import jax; assert jax.__version__ == '0.10.0'"

      - name: Run non-system tests
        run: python -m pytest --ignore=tests/systems -m "not memory_intensive"

      - name: Run remaining system tests
        run: |
          python -m pytest tests/systems \
            --ignore=tests/systems/test_gvs.py \
            --ignore=tests/systems/test_pcs.py \
            --ignore=tests/systems/test_planar_pcs.py \
            -m "not memory_intensive"

      - name: Run GVS system tests
        run: |
          # Bound the JAX/XLA executable memory retained by each Python process.
          mapfile -t gvs_tests < <(
            python -m pytest tests/systems/test_gvs.py \
              -m "not memory_intensive" \
              --collect-only -q | sed -n '/^tests\/systems\/test_gvs.py::/p'
          )
          if (( ${#gvs_tests[@]} == 0 )); then
            echo "No GVS tests were collected." >&2
            exit 1
          fi
          for ((start = 0; start < ${#gvs_tests[@]}; start += 20)); do
            python -m pytest "${gvs_tests[@]:start:20}"
          done

      - name: Run PCS system tests
        run: python -m pytest tests/systems/test_pcs.py -m "not memory_intensive"

      - name: Run PlanarPCS system tests
        run: python -m pytest tests/systems/test_planar_pcs.py -m "not memory_intensive"

      - name: Run memory-intensive GVS tests
        run: |
          python -m pytest tests/systems/test_gvs.py::test_forward_mode_automatic_differentiability_at_zero_configuration
          python -m pytest tests/systems/test_gvs.py::test_reverse_mode_automatic_differentiability_at_zero_configuration
          python -m pytest tests/systems/test_gvs.py::test_gvs_autodiff_checks
          for basis_type in monomial legendre chebyshev fourier gaussian imq; do
            python -m pytest "tests/systems/test_gvs.py::test_scaled_rotational_basis_batched_partial_cells_match_scalar_paths[$basis_type]"
          done
