# Build a tagged release once, attach the validated artifacts to GitHub, and
# publish the same files to PyPI through trusted publishing.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine
          python -m build .
          python -m twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: soromox-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: soromox-${{ needs.build.outputs.version }}
          path: dist/

      - name: Extract changelog
        id: changelog
        shell: bash
        run: |
          python extract_changelog.py "${{ needs.build.outputs.version }}" --output /tmp/changelog.md
          {
            echo "content<<EOF"
            cat /tmp/changelog.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: SoRoMoX v${{ needs.build.outputs.version }}
          body: |
            # SoRoMoX v${{ needs.build.outputs.version }}

            ${{ steps.changelog.outputs.content }}

            ## Installation

            ```bash
            pip install soromox==${{ needs.build.outputs.version }}
            ```

            See the full [changelog](https://github.com/tud-phi/soromox/blob/v${{ needs.build.outputs.version }}/docs/development/changelog.md).
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - build
      - create-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/soromox
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: soromox-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
