site_name: Soft Robot Models in jaX (SoRoMoX)
site_description: High-performance kinematic and dynamic models of continuum and articulated soft robots using JAX
site_author: Maximilian Stölzle, Solange Gribonval, Daniel Feliu-Talegon, Vito Daniele Perfetta, Michele Martini, Chuhan Zhang, Kiwan Wong, Daniela Rus, and Cosimo Della Santina
site_url: https://tud-phi.github.io/soromox

repo_name: tud-phi/soromox
repo_url: https://github.com/tud-phi/soromox
edit_uri: edit/main/docs/
not_in_nav: 404.md

copyright: Copyright &copy; 2025-2026 SoRoMoX contributors

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo/soromox_logo_s.png
  favicon: assets/logo/favicon/favicon.ico
  palette:
    # Light mode only - indigo header for logo contrast, cyan accents
    - scheme: default
      primary: indigo
      accent: cyan
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    tag:
      default: material/tag
      robot: material/robot
      math: material/function-variant
      api: material/api

nav:
  - Home: index.md
  - Installation: installation.md
  - User Guide:
    - Quick Start: user-guide/quick-start.md
    - Parameters and Optimization: user-guide/parameters-and-optimization.md
    - Floating-base Systems: user-guide/floating-base-systems.md
    - Execution Devices and Backends: user-guide/execution-devices-and-backends.md
    - Examples: user-guide/examples.md
  - API Reference:
      - Overview: api/overview.md
      - Systems:
          - Overview: api/systems/index.md
          - Continuum Robot Components: api/systems/continuum-components.md
          - Articulated Systems:
            - Overview: api/systems/articulated/index.md
            - Pendulum: api/systems/pendulum/pendulum.md
            - Articulated Soft Robot: api/systems/articulated/articulated-soft-robot.md
            - McKibben UMArm: api/systems/articulated/mckibben-umarm.md
          - PCS Systems:
            - Overview: api/systems/pcs/index.md
            - Spatial PCS: api/systems/pcs/pcs.md
            - Planar PCS: api/systems/pcs/planar-pcs.md
            - Planar HSA: api/systems/pcs/planar-hsa.md
            - I-Support: api/systems/pcs/isupport.md
          - GVS Systems:
            - Overview: api/systems/gvs/index.md
            - GVS: api/systems/gvs/gvs.md
      - Execution Backends:
          - Overview: api/execution/index.md
          - Configuration: api/execution/configuration.md
          - Warp:
            - Overview: api/execution/warp/index.md
            - GVS API: api/execution/warp/gvs.md
            - PCS API: api/execution/warp/pcs.md
      - Rendering:
          - Overview: api/rendering/index.md
          - Renderer API: api/rendering/renderers.md
          - Shared Configuration: api/rendering/configuration.md
      - Actuation:
          - Actuation Model: api/actuation/index.md
          - Joint-Space Actuation: api/actuation/joint-space.md
          - Threadlike Actuation: api/actuation/threadlike.md
          - API Reference: api/actuation/reference.md
      - Control:
          - Overview: api/control/index.md
          - Configuration-Space Controllers: api/control/configuration-space.md
          - Operational-Space Controllers: api/control/operational-space.md
          - Actuation-Space Controllers: api/control/actuation-space.md
          - Utilities: api/control/utilities.md
      - Utilities:
          - Overview: api/utilities/index.md
          - Parameters: api/utilities/parameters.md
          - Numerics: api/utilities/numerics.md
          - Geometry: api/utilities/geometry.md
          - Lie Algebra: api/utilities/lie-algebra.md
          - Constant Strain: api/utilities/constant-strain.md
          - Numerical Jacobian: api/utilities/numerical-jacobian.md
  - Paper & Results: research.md
  - Citation: citation.md
  - Development:
    - Contributing: development/contributing.md
    - Extending SoRoMoX: development/extending.md
    - System Benchmarking: development/benchmarking.md
    - Changelog: development/changelog.md
  - Authors & Maintainers: authors.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_toc_entry: false
            merge_init_into_class: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: false
            group_by_category: true
            heading_level: 2
            members_order: source
            docstring_section_style: table
            line_length: 80
            show_if_no_docstring: false
            separate_signature: true
            show_signature: true
            signature_crossrefs: true
            show_bases: true
            inherited_members: true
            show_inheritance_diagram: true
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_classes: true
            show_docstring_modules: true
          paths: [src]
  - section-index

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.txt
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/sidebar.css
  - stylesheets/media.css

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tud-phi/soromox
      name: View on GitHub
    - icon: fontawesome/solid/file-lines
      link: https://arxiv.org/abs/2608.06650
      name: Read the SoRoMoX paper
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/soromox/
      name: View on PyPI
    - icon: fontawesome/solid/paper-plane
      link: mailto:mstolzle@mit.edu
      name: Contact us
  generator: false
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/tud-phi/soromox/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">telling us what you need</a>.

watch:
  - src/soromox
