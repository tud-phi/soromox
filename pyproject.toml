# List URLs that are relevant to your project
#
# This field corresponds to the "Project-URL" and "Home-Page" metadata fields:
# https://packaging.python.org/specifications/core-metadata/#project-url-multiple-use
# https://packaging.python.org/specifications/core-metadata/#home-page-optional
#
# Examples listed include a pattern for specifying where the package tracks
# issues, where the source is hosted, where to say thanks to the package
# maintainers, and where to support the project financially. The key is
# what's used to render the link text on PyPI.
[project.urls]  # Optional
"Homepage" = "https://github.com/tud-phi/soromox"
"Documentation" = "https://tud-phi.github.io/soromox"
"Changelog" = "https://tud-phi.github.io/soromox/development/changelog/"
"Bug Reports" = "https://github.com/tud-phi/soromox/issues"
"Paper" = "https://doi.org/10.48550/arXiv.2608.06650"
"Citation" = "https://tud-phi.github.io/soromox/citation/"
"Source" = "https://github.com/tud-phi/soromox"

# The following would provide a command line executable called `sample`
# which executes the function `main` from this package when invoked.
[project.scripts]  # Optional
# sample = "sample:main"

# This is configuration specific to the `setuptools` build backend.
# If you are using a different build backend, you will need to change this.
[tool.setuptools]
# packages = ["soromox"]
include-package-data = false
[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
# exclude = ["build", "examples", "tests"]
[tool.check-manifest]
# The PyPI source distribution intentionally contains the installable package
# and packaging metadata, not the repository's research data, examples, docs,
# development tools, or generated media.
ignore = [
  ".flake8",
  ".pre-commit-config.yaml",
  ".vscode/**",
  "CITATION.cff",
  "CONTRIBUTING.md",
  "Makefile",
  "VERSION_BUMP_README.md",
  "assets/**",
  "benchmarks/**",
  "bump_version.py",
  "data/**",
  "docs/**",
  "examples/**",
  "extract_changelog.py",
  "mkdocs.yml",
  "overrides/**",
  "paper_results/**",
  "tests/**",
  "tools/**",
  "uv.lock",
]

[build-system]
# These are the assumed default build requirements from pip:
# https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support
requires = ["pip>=23.1", "setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# ==================== Pytest Configuration ====================
[tool.pytest.ini_options]
markers = [
    "memory_intensive: tests isolated in CI because they require substantial JAX/XLA memory",
]

# ==================== Coverage Configuration ====================
[tool.coverage.run]
source = ["src/soromox"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# ==================== Ruff Configuration ====================
[tool.ruff]
# Target Python version
target-version = "py311"

# Line length (same as Black)
line-length = 88

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable recommended rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # allow zip calls without an explicit strict= argument
    "SIM108", # use ternary operator instead of if-else
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402"]
"paper_results/**/*.py" = ["E402"]
"tools/benchmarks/**/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["soromox"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Auto-detect line ending
line-ending = "auto"
